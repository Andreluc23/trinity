spring.application.name=trinity

# Banco de dados SQLite (arquivo ./data/trinity.db; a pasta data precisa existir)
spring.datasource.url=jdbc:sqlite:./data/trinity.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma gravaÁ„o por vez: uma conex„o evita o erro "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Administrador inicial (criado apenas se n√£o existir nenhum e se as duas vari√°veis estiverem definidas)
trinity.admin.email=${TRINITY_ADMIN_EMAIL:}
trinity.admin.senha=${TRINITY_ADMIN_SENHA:}

# JWT (obrigatorio: defina a variavel de ambiente TRINITY_JWT_SEGREDO)
trinity.jwt.segredo=${TRINITY_JWT_SEGREDO}
trinity.jwt.validade-minutos=15
trinity.jwt.refresh-validade-dias=7

# Formatacao em portugues (moeda R$, nomes de meses)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# PIX da igreja (troque pelos dados reais ou use variaveis de ambiente)
trinity.pix.chave=d504413d-01ab-48f7-b081-2ce80c7b07ac
trinity.pix.nome-recebedor=${TRINITY_PIX_NOME:Igreja Trinity}
trinity.pix.cidade=${TRINITY_PIX_CIDADE:Umuarama}
