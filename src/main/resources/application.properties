spring.application.name=trinity

# Banco de dados H2 persistente
spring.datasource.url=jdbc:h2:file:./data/trinity
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Administrador inicial (criado apenas se não existir nenhum)
trinity.admin.email=${TRINITY_ADMIN_EMAIL:admin@trinity.com}
trinity.admin.senha=${TRINITY_ADMIN_SENHA:Trinity@2026}

# JWT
trinity.jwt.segredo=${TRINITY_JWT_SEGREDO:3Cqu33JAuq8ZuqLST/KMVb8T7BF7xbK5Luig0OPON9U0Q5h9N74FneuGezQp+7cs}
trinity.jwt.validade-minutos=15
trinity.jwt.refresh-validade-dias=7

# Formatação em português (moeda R$, nomes de meses)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
