<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Função Musical - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4">

            <h2 class="mb-4"
                th:text="${funcaoMusical.id == null ? 'Nova função musical' : 'Editar função musical'}">
                Nova função musical
            </h2>

            <form th:action="@{/funcoes-musicais}"
                  th:object="${funcaoMusical}"
                  method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ativo}">

                <div class="mb-4">

                    <label class="form-label">
                        Nome da função ou instrumento
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nome}"
                           placeholder="Ex.: Violão, Bateria, Vocal"
                           required>

                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg me-1"></i>
                        Salvar

                    </button>

                    <a th:href="@{/funcoes-musicais}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
