<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-sm login-card">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h2>Trinity</h2>
                <p class="text-muted">
                    Acesse sua conta
                </p>
            </div>

            <div th:if="${param.erro}" class="alert alert-danger" role="alert">
                E-mail ou senha incorretos.
            </div>

            <div th:if="${param.inativo}" class="alert alert-warning" role="alert">
                Sua conta está desativada. Fale com a administração da igreja.
            </div>

            <form method="post" th:action="@{/login}">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        E-mail
                    </label>

                    <input type="email"
                           class="form-control"
                           id="username"
                           name="username"
                           autocomplete="username"
                           th:value="${param.email} ? ${param.email[0]} : ''"
                           th:autofocus="${param.email == null}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           th:autofocus="${param.email != null}"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Entrar
                </button>

            </form>

            <div class="text-center mt-3">
                <a class="small text-decoration-none"
                   data-bs-toggle="collapse"
                   href="#ajudaSenha"
                   role="button"
                   aria-controls="ajudaSenha">
                    Esqueci minha senha
                </a>

                <div id="ajudaSenha" class="collapse small text-muted mt-2">
                    Procure a administração da igreja para redefinir sua senha.
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-decoration-none">
                    Voltar para o início
                </a>
            </div>

        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
