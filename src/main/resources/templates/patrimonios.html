<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Patrimônio - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('patrimonios')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center
                gap-3 mb-4">

        <div>
            <h2 class="mb-1">Patrimônio</h2>

            <p class="text-muted mb-0">
                Gerencie os bens e equipamentos da igreja.
            </p>
        </div>

        <a th:href="@{/patrimonios/novo}"
           class="btn btn-primary text-nowrap">

            <i class="bi bi-plus-lg me-1"></i>
            Novo patrimônio

        </a>

    </div>
    <form th:action="@{/patrimonios}" method="get" class="mb-4">

        <div class="input-group">

            <input type="text"
                   name="termo"
                   class="form-control"
                   placeholder="Buscar por nome, categoria ou localização..."
                   th:value="${termo}">

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-search me-1"></i>
                Buscar

            </button>

            <a th:if="${termo != null and !termo.isBlank()}"
               th:href="@{/patrimonios}"
               class="btn btn-outline-secondary">
                Limpar
            </a>

        </div>

    </form>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">

        <div class="table-responsive">

            <table class="table align-middle mb-0">

                <thead class="table-light">

                <tr>
                    <th>Item</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Estado</th>
                    <th>Localização</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="patrimonio : ${patrimonios}">

                    <td th:text="${patrimonio.nome}">
                        Mesa de som
                    </td>

                    <td th:text="${patrimonio.categoria}">
                        Áudio
                    </td>

                    <td th:text="${patrimonio.quantidade}">
                        1
                    </td>

                    <td th:text="${patrimonio.estadoConservacao}">
                        Bom
                    </td>

                    <td th:text="${patrimonio.localizacao != null && !patrimonio.localizacao.isBlank()
                                    ? patrimonio.localizacao
                                    : '-'}">
                        Templo
                    </td>

                    <td>

                        <span th:if="${patrimonio.ativo}"
                              class="badge text-bg-success">
                            Ativo
                        </span>

                        <span th:unless="${patrimonio.ativo}"
                              class="badge text-bg-secondary">
                            Inativo
                        </span>

                    </td>

                    <td class="text-end text-nowrap">

                        <a th:href="@{/patrimonios/editar/{id}(id=${patrimonio.id})}"
                           class="btn btn-sm btn-outline-primary">

                            <i class="bi bi-pencil"></i>
                            Editar

                        </a>

                        <form th:if="${patrimonio.ativo}"
                              th:action="@{/patrimonios/desativar/{id}(id=${patrimonio.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">

                                Desativar

                            </button>

                        </form>

                        <form th:unless="${patrimonio.ativo}"
                              th:action="@{/patrimonios/ativar/{id}(id=${patrimonio.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-success">

                                Ativar

                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(patrimonios)}">

                    <td colspan="7"
                        class="text-center text-muted py-5">

                        <i class="bi bi-box-seam fs-3 d-block mb-2"></i>

                        Nenhum patrimônio cadastrado.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
