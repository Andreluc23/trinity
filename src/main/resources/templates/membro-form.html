<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo membro | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="mb-4">
        <h1>Novo membro</h1>
        <p class="text-muted">
            Preencha os dados abaixo para cadastrar um novo membro.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form th:action="@{/membros}" th:object="${membro}" method="post">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nome completo</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nomeCompleto}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Data de nascimento</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{dataNascimento}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">CPF</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{cpf}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Telefone</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{telefone}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Endereço</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{endereco}">
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-2"></i>
                        Salvar
                    </button>

                    <a th:href="@{/membros}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
