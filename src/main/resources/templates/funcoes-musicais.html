<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Funções Musicais - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-sm-row
                justify-content-between align-items-sm-center
                gap-3 mb-4">

        <div>
            <h2 class="mb-1">Funções musicais</h2>
            <p class="text-muted mb-0">
                Gerencie os instrumentos e funções utilizados nas escalas.
            </p>
        </div>

        <a th:href="@{/funcoes-musicais/nova}"
           class="btn btn-primary text-nowrap">

            <i class="bi bi-plus-circle me-1"></i>
            Nova função

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="funcao : ${funcoes}">

                        <td th:text="${funcao.nome}">
                            Violão
                        </td>

                        <td>
                            <span th:if="${funcao.ativo}"
                                  class="badge text-bg-success">
                                Ativa
                            </span>

                            <span th:unless="${funcao.ativo}"
                                  class="badge text-bg-secondary">
                                Inativa
                            </span>
                        </td>

                        <td class="text-end text-nowrap">

                            <a th:href="@{/funcoes-musicais/editar/{id}(id=${funcao.id})}"
                               class="btn btn-sm btn-outline-primary">

                                <i class="bi bi-pencil"></i>
                                Editar

                            </a>

                            <form th:if="${funcao.ativo}"
                                  th:action="@{/funcoes-musicais/desativar/{id}(id=${funcao.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Desativar
                                </button>

                            </form>

                            <form th:unless="${funcao.ativo}"
                                  th:action="@{/funcoes-musicais/ativar/{id}(id=${funcao.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-success">
                                    Ativar
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(funcoes)}">
                        <td colspan="3"
                            class="text-center text-muted py-4">
                            Nenhuma função musical cadastrada.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
