<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Presenças - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('eventos')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;"
      th:with="vao=${presencas.?[resposta.name() == 'VOU']},
               naoVao=${presencas.?[resposta.name() == 'NAO_VOU']}">

    <div class="mb-4">
        <h2 class="mb-1" th:text="${evento.titulo}">Culto de Domingo</h2>
        <p class="text-muted mb-0">
            <i class="bi bi-calendar3 me-1"></i>
            <span th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')}">20/09/2026</span>
            às
            <span th:text="${#temporals.format(evento.horario, 'HH:mm')}">19:00</span>
            · <span th:text="${evento.local}">Templo</span>
        </p>
    </div>

    <div class="row g-4">

        <!-- Vão -->
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">

                    <h5 class="text-success mb-3">
                        <i class="bi bi-check-circle me-1"></i>
                        Vão (<span th:text="${#lists.size(vao)}">0</span>)
                    </h5>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-0" th:each="presenca : ${vao}"
                            th:text="${presenca.membro.nomeCompleto}">João</li>
                    </ul>

                    <p th:if="${#lists.isEmpty(vao)}" class="text-muted mb-0">Ninguém confirmou ainda.</p>

                </div>
            </div>
        </div>

        <!-- Não vão -->
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">

                    <h5 class="text-danger mb-3">
                        <i class="bi bi-x-circle me-1"></i>
                        Não vão (<span th:text="${#lists.size(naoVao)}">0</span>)
                    </h5>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-0" th:each="presenca : ${naoVao}"
                            th:text="${presenca.membro.nomeCompleto}">Maria</li>
                    </ul>

                    <p th:if="${#lists.isEmpty(naoVao)}" class="text-muted mb-0">Nenhuma recusa.</p>

                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a th:href="@{/eventos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar para eventos
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
