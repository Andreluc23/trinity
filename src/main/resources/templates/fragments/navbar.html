<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar(paginaAtiva)"
     class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand fw-semibold" th:href="@{/dashboard}">Trinity</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarTrinity"
                aria-controls="navbarTrinity"
                aria-expanded="false"
                aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarTrinity">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'inicio'} ? ' opacity-50' : ''"
                       th:href="@{/dashboard}">
                        <i class="bi bi-house-door me-1"></i> Início
                    </a>
                </li>

                <li class="nav-item"
                    sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'GERENCIAR_MEMBROS')">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'membros'} ? ' opacity-50' : ''"
                       th:href="@{/membros}">
                        <i class="bi bi-people me-1"></i> Membros
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'avisos'} ? ' opacity-50' : ''"
                       th:href="@{/avisos}">
                        <i class="bi bi-megaphone me-1"></i> Avisos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'eventos'} ? ' opacity-50' : ''"
                       th:href="@{/eventos}">
                        <i class="bi bi-calendar-event me-1"></i> Eventos
                    </a>
                </li>

                <li class="nav-item"
                    sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'VISUALIZAR_ESCALAS', 'GERENCIAR_ESCALAS')">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'escalas'} ? ' opacity-50' : ''"
                       th:href="@{/escalas}">
                        <i class="bi bi-music-note-list me-1"></i> Escalas
                    </a>
                </li>

                <li class="nav-item"
                    sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'GERENCIAR_PATRIMONIO')">
                    <a class="nav-link text-white"
                       th:classappend="${paginaAtiva == 'patrimonios'} ? ' opacity-50' : ''"
                       th:href="@{/patrimonios}">
                        <i class="bi bi-box-seam me-1"></i> Patrimônio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">
                        <i class="bi bi-cash-coin me-1"></i> Financeiro
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">
                        <i class="bi bi-book me-1"></i> Bíblia
                    </a>
                </li>

            </ul>

            <div class="d-flex gap-2">

                <a th:href="@{/perfil}"
                   class="btn btn-outline-light"
                   th:classappend="${paginaAtiva == 'perfil'} ? ' active' : ''">
                    <i class="bi bi-person-circle me-1"></i> Meu perfil
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light">
                        <i class="bi bi-box-arrow-right me-1"></i> Sair
                    </button>
                </form>

            </div>

    </div>

</nav>

</body>
</html>
