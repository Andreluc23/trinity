<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Logo do Trinity (triângulo com a cruz), desenhada em SVG.
    Usa "currentColor": fica na mesma cor do texto em volta,
    então a cor é definida pelo CSS de onde ela for colocada.
    Uso: <svg th:replace="~{fragments/logo :: logo(32)}"></svg>
-->
<svg th:fragment="logo(tamanho)"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     th:width="${tamanho}"
     th:height="${tamanho}"
     fill="none"
     stroke="currentColor"
     stroke-width="6"
     stroke-linecap="round"
     stroke-linejoin="round"
     role="img"
     aria-label="Trinity">
    <path d="M43 84 H20 Q12 84 16 77 L45.5 22 Q50 14 54.5 22 L84 77 Q88 84 80 84 H57"/>
    <path d="M50 39 V80"/>
    <path d="M38 51 H62"/>
</svg>

</body>
</html>
