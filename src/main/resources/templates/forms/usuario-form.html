<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Usuário - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<main class="container py-4 py-md-5">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

            <div class="mb-4">
                <h2 th:text="${usuario.id == null ? 'Novo usuário' : 'Editar usuário'}">
                    Usuário
                </h2>

                <p class="text-muted mb-0">
                    Defina os dados e as permissões de acesso.
                </p>
            </div>

            <div class="card shadow-sm border-0">

                <div class="card-body p-3 p-md-4">

                    <form th:action="@{/usuarios}"
                          th:object="${usuario}"
                          method="post">

                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{ativo}">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nome}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-mail</label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Senha</label>

                            <input type="password"
                                   class="form-control"
                                   th:field="*{senha}"
                                   th:required="${usuario.id == null}">

                            <div th:if="${usuario.id != null}"
                                 class="form-text">
                                Deixe em branco para manter a senha atual.
                            </div>
                        </div>

                        <hr>

                        <h5 class="mb-3">Permissões</h5>

                        <div class="form-check mb-3">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{admin}">

                            <label class="form-check-label fw-semibold">
                                Administrador
                            </label>

                            <div class="form-text">
                                Administradores terão acesso total ao sistema.
                            </div>
                        </div>

                        <div class="row">

                            <div class="col-12 col-md-6">

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoMembros}">
                                    <label class="form-check-label">Membros</label>
                                </div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoAvisos}">
                                    <label class="form-check-label">Avisos</label>
                                </div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoEventos}">
                                    <label class="form-check-label">Eventos</label>
                                </div>

                            </div>

                            <div class="col-12 col-md-6">

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoEscalas}">
                                    <label class="form-check-label">Escalas</label>
                                </div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoPatrimonio}">
                                    <label class="form-check-label">Patrimônio</label>
                                </div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoFinanceiro}">
                                    <label class="form-check-label">Financeiro</label>
                                </div>

                            </div>

                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                            <button type="submit"
                                    class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                Salvar
                            </button>

                            <a th:href="@{/usuarios}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
