
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Acesso - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('membros')}"></div>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-person-lock me-2"></i>
            Criar acesso
        </h2>
        <p class="text-muted">
            Defina uma senha provisória para o membro acessar o Trinity.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <div class="mb-4">
                <h5 class="fw-semibold mb-3">Dados do membro</h5>

                <p class="mb-2">
                    <strong>Nome:</strong>
                    <span th:text="${membro.nomeCompleto}"></span>
                </p>

                <p class="mb-0">
                    <strong>E-mail:</strong>
                    <span th:text="${membro.email != null ? membro.email : 'Não informado'}"></span>
                </p>
            </div>

            <div th:if="${erro}"
                 class="alert alert-danger"
                 th:text="${erro}">
            </div>

            <form th:action="@{/usuarios/criar-acesso/{id}(id=${membro.id})}"
                  method="post">

                <div class="mb-3">
                    <label for="senhaProvisoria" class="form-label">
                        Senha provisória
                    </label>

                    <input type="password"
                           class="form-control"
                           id="senhaProvisoria"
                           name="senhaProvisoria"
                           minlength="8"
                           autocomplete="new-password"
                           required>

                    <div class="form-text">
                        A senha deve ter pelo menos 8 caracteres.
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a th:href="@{/membros}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        Criar acesso
                    </button>

                </div>

            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
