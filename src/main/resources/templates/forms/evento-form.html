<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evento | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('eventos')}"></div>

<div class="container py-4 py-md-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4">

            <h2 class="mb-4"
                th:text="${evento.id == null ? 'Novo evento' : 'Editar evento'}">
                Novo evento
            </h2>

            <form th:action="@{/eventos}"
                  th:object="${evento}"
                  method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ativo}">

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label">Título</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{titulo}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Local</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{local}">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Data</label>

                        <input type="date"
                               class="form-control"
                               name="data"
                               th:value="${evento.data != null ? #temporals.format(evento.data, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Horário</label>

                        <input type="time"
                               class="form-control"
                               name="horario"
                               th:value="${evento.horario != null ? #temporals.format(evento.horario, 'HH:mm') : ''}"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Descrição</label>

                        <textarea class="form-control"
                                  th:field="*{descricao}"
                                  rows="5"></textarea>
                    </div>

                </div>

                <div class="mt-4 d-flex flex-column flex-sm-row gap-2">

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar
                    </button>

                    <a th:href="@{/eventos}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
