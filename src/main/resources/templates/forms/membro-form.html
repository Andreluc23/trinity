<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo membro | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('membros')}"></div>

<div class="container py-4 py-md-5">

    <div class="mb-4">
        <h1 th:text="${membro.id == null ? 'Novo membro' : 'Editar membro'}">
            Novo membro
        </h1>

        <p class="text-muted">
            Preencha os dados abaixo para cadastrar ou atualizar um membro.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4">

            <div th:if="${erro}"
                 class="alert alert-danger"
                 role="alert">

                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${erro}"></span>

            </div>

            <form th:action="@{/membros}"
                  th:object="${membro}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nome completo</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nomeCompleto}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Data de nascimento</label>

                        <input type="date"
                               class="form-control"
                               name="dataNascimento"
                               th:value="${membro.dataNascimento != null ? #temporals.format(membro.dataNascimento, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">CPF</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{cpf}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Telefone</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{telefone}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">E-mail</label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Endereço</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{endereco}">
                    </div>

                </div>

                <div class="mt-4 d-flex flex-column flex-sm-row gap-2">

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-2"></i>
                        Salvar
                    </button>

                    <a th:href="@{/membros}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
