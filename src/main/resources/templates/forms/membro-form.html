<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo membro | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('membros')}"></div>

<div class="container py-4 py-md-5">

    <div class="mb-4">
        <h1 th:text="${membro.id == null ? 'Novo membro' : 'Editar membro'}">
            Novo membro
        </h1>

        <p class="text-muted">
            Preencha os dados abaixo para cadastrar ou atualizar um membro.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4">

            <div th:if="${erro}"
                 class="alert alert-danger"
                 role="alert">

                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${erro}"></span>

            </div>

            <form th:action="@{/membros}"
                  th:object="${membro}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nome completo</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nomeCompleto}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Data de nascimento</label>

                        <input type="date"
                               class="form-control"
                               name="dataNascimento"
                               th:value="${membro.dataNascimento != null ? #temporals.format(membro.dataNascimento, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="cpf" class="form-label">CPF</label>

                        <input type="text"
                               id="cpf"
                               name="cpf"
                               class="form-control"
                               th:value="${membro.cpfFormatado}"
                               maxlength="14"
                               placeholder="000.000.000-00"
                               inputmode="numeric"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Telefone</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{telefone}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">E-mail</label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}">
                    </div>

                    <!-- Endereço -->
                    <div class="col-12 mt-4">
                        <h6 class="text-muted mb-0">Endereço <span class="fw-normal">(opcional)</span></h6>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text"
                               id="cep"
                               name="endereco.cep"
                               class="form-control"
                               th:value="${membro.endereco.cepFormatado}"
                               maxlength="9"
                               placeholder="00000-000"
                               inputmode="numeric"
                               autocomplete="postal-code">
                        <div id="avisoCep" class="form-text"></div>
                    </div>

                    <div class="col-12 col-md-7">
                        <label for="logradouro" class="form-label">Rua / Avenida</label>
                        <input type="text" id="logradouro" class="form-control" th:field="*{endereco.logradouro}">
                    </div>

                    <div class="col-12 col-md-2">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text" id="numero" class="form-control" th:field="*{endereco.numero}" maxlength="10">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="complemento" class="form-label">Complemento</label>
                        <input type="text" id="complemento" class="form-control" th:field="*{endereco.complemento}"
                               placeholder="Apto, bloco, casa...">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" id="bairro" class="form-control" th:field="*{endereco.bairro}">
                    </div>

                    <div class="col-8 col-md-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" id="cidade" class="form-control" th:field="*{endereco.cidade}">
                    </div>

                    <div class="col-4 col-md-1">
                        <label for="uf" class="form-label">UF</label>
                        <input type="text" id="uf" class="form-control text-uppercase" th:field="*{endereco.uf}" maxlength="2">
                    </div>

                </div>

                <div class="mt-4 d-flex flex-column flex-sm-row gap-2">

                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-check-lg me-2"></i>
                        Salvar
                    </button>

                    <a th:href="@{/membros}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Ao informar um CEP válido, busca o endereço no ViaCEP e preenche os campos
    (() => {
        const campoCep = document.getElementById('cep');
        const aviso = document.getElementById('avisoCep');
        let ultimoCepBuscado = null;

        function preencher(campo, valor) {
            const elemento = document.querySelector(`[name="endereco.${campo}"]`);
            if (elemento) {
                elemento.value = valor || '';
            }
        }

        async function buscarCep() {
            const cep = campoCep.value.replace(/\D/g, '');

            if (cep.length !== 8) {
                aviso.textContent = cep.length > 0 ? 'O CEP deve ter 8 dígitos.' : '';
                return;
            }

            campoCep.value = cep.slice(0, 5) + '-' + cep.slice(5);

            if (cep === ultimoCepBuscado) {
                return;
            }
            ultimoCepBuscado = cep;
            aviso.textContent = 'Buscando endereço...';

            try {
                const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const dados = await resposta.json();

                if (dados.erro) {
                    aviso.textContent = 'CEP não encontrado. Preencha o endereço manualmente.';
                    return;
                }

                preencher('logradouro', dados.logradouro);
                preencher('bairro', dados.bairro);
                preencher('cidade', dados.localidade);
                preencher('uf', dados.uf);

                aviso.textContent = dados.logradouro
                    ? ''
                    : 'CEP único da cidade: informe a rua e o bairro.';
                document.querySelector('[name="endereco.numero"]').focus();
            } catch (erro) {
                aviso.textContent = 'Não foi possível consultar o CEP agora. Preencha manualmente.';
            }
        }

        // Busca ao completar os 8 dígitos e também ao sair do campo
        campoCep.addEventListener('input', () => {
            if (campoCep.value.replace(/\D/g, '').length === 8) {
                buscarCep();
            }
        });
        campoCep.addEventListener('blur', buscarCep);
    })();
</script>

</body>
</html>
</body>
</html>
