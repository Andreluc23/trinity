<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escala - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5">

    <div class="card shadow-sm border-0">

        <div class="card-body p-3 p-md-4">

            <h2 class="mb-4"
                th:text="${escala.id == null ? 'Nova escala' : 'Editar escala'}">
                Nova escala
            </h2>

            <!-- Formulário da escala -->
            <form th:action="@{/escalas}"
                  th:object="${escala}"
                  method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ativo}">

                <div class="mb-3">

                    <label class="form-label">
                        Título
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{titulo}"
                           placeholder="Ex.: Culto de Domingo"
                           required>

                </div>

                <div class="row">

                    <div class="col-12 col-md-6 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input type="date"
                               class="form-control"
                               name="data"
                               th:value="${escala.data != null ? #temporals.format(escala.data, 'yyyy-MM-dd') : ''}"
                               required>

                    </div>

                    <div class="col-12 col-md-6 mb-3">

                        <label class="form-label">
                            Horário
                        </label>

                        <input type="time"
                               class="form-control"
                               name="horario"
                               th:value="${escala.horario != null ? #temporals.format(escala.horario, 'HH:mm') : ''}"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Observação
                    </label>

                    <textarea class="form-control"
                              th:field="*{observacao}"
                              rows="4"
                              placeholder="Informações adicionais sobre a escala"></textarea>

                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg me-1"></i>
                        Salvar

                    </button>

                    <a th:href="@{/escalas}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>




        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
