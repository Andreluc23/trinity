<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escala - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;">

    <h2 class="mb-4" th:text="${escala.id == null ? 'Nova escala' : 'Editar escala'}">
        Nova escala
    </h2>

    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/escalas}" th:object="${escala}" method="post">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{ativo}">

        <!-- Dados da escala -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-3 p-md-4">

                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text"
                           id="titulo"
                           class="form-control"
                           th:field="*{titulo}"
                           placeholder="Ex.: Culto de Domingo"
                           required>
                </div>

                <div class="row g-3 mb-3">

                    <div class="col-12 col-md-6">
                        <label for="data" class="form-label">Data</label>
                        <input type="date"
                               id="data"
                               name="data"
                               class="form-control"
                               th:value="${escala.data != null ? #temporals.format(escala.data, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="horario" class="form-label">Horário</label>
                        <input type="time"
                               id="horario"
                               name="horario"
                               class="form-control"
                               th:value="${escala.horario != null ? #temporals.format(escala.horario, 'HH:mm') : ''}"
                               required>
                    </div>

                </div>

                <div>
                    <label for="observacao" class="form-label">
                        Observação <span class="text-muted">(opcional)</span>
                    </label>
                    <textarea id="observacao"
                              class="form-control"
                              th:field="*{observacao}"
                              rows="2"
                              placeholder="Informações adicionais sobre a escala"></textarea>
                </div>

            </div>
        </div>

        <!-- Integrantes -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-3 p-md-4">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                    <div>
                        <h5 class="mb-1">Integrantes</h5>
                        <p class="text-muted small mb-0">
                            Cada pessoa e cada função podem aparecer uma única vez.
                        </p>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button"
                                class="btn btn-outline-secondary text-nowrap"
                                data-bs-toggle="modal"
                                data-bs-target="#modalNovaFuncao">
                            <i class="bi bi-music-note me-1"></i>
                            Nova função
                        </button>

                        <button type="button" id="botaoAdicionar" class="btn btn-outline-dark text-nowrap">
                            <i class="bi bi-person-plus me-1"></i>
                            Adicionar integrante
                        </button>
                    </div>
                </div>

                <div id="listaIntegrantes">

                    <!-- Linhas já existentes (edição ou retorno com erro) -->
                    <div class="row g-2 align-items-center mb-2 linha-integrante"
                         th:each="integrante : ${integrantes}">

                        <div class="col-12 col-md-6">
                            <select name="membroIds" class="form-select" aria-label="Membro" required>
                                <option value="">Selecione o membro</option>
                                <option th:each="membro : ${membros}"
                                        th:value="${membro.id}"
                                        th:text="${membro.nomeCompleto}"
                                        th:selected="${membro.id == integrante.membroId}">
                                </option>
                            </select>
                        </div>

                        <div class="col-10 col-md-5">
                            <select name="funcaoIds" class="form-select" aria-label="Função" required>
                                <option value="">Selecione a função</option>
                                <option th:each="funcao : ${funcoes}"
                                        th:value="${funcao.id}"
                                        th:text="${funcao.nome}"
                                        th:selected="${funcao.id == integrante.funcaoId}">
                                </option>
                            </select>
                        </div>

                        <div class="col-2 col-md-1 text-end">
                            <button type="button" class="btn btn-outline-danger botao-remover"
                                    title="Remover" aria-label="Remover integrante">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>

                    </div>

                </div>

                <p id="semIntegrantes" class="text-muted text-center py-3 mb-0">
                    Nenhum integrante adicionado.
                </p>

            </div>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2">
            <button type="submit" class="btn btn-dark">
                <i class="bi bi-check-lg me-1"></i>
                Salvar escala
            </button>

            <a th:href="@{/escalas}" class="btn btn-outline-secondary">
                Cancelar
            </a>
        </div>

    </form>

    <!-- Modelo de linha vazia, copiado pelo botão "Adicionar integrante" -->
    <template id="modeloIntegrante">
        <div class="row g-2 align-items-center mb-2 linha-integrante">

            <div class="col-12 col-md-6">
                <select name="membroIds" class="form-select" aria-label="Membro" required>
                    <option value="">Selecione o membro</option>
                    <option th:each="membro : ${membros}"
                            th:value="${membro.id}"
                            th:text="${membro.nomeCompleto}">
                    </option>
                </select>
            </div>

            <div class="col-10 col-md-5">
                <select name="funcaoIds" class="form-select" aria-label="Função" required>
                    <option value="">Selecione a função</option>
                    <option th:each="funcao : ${funcoes}"
                            th:value="${funcao.id}"
                            th:text="${funcao.nome}">
                    </option>
                </select>
            </div>

            <div class="col-2 col-md-1 text-end">
                <button type="button" class="btn btn-outline-danger botao-remover"
                        title="Remover" aria-label="Remover integrante">
                    <i class="bi bi-trash"></i>
                </button>
            </div>

        </div>
    </template>

    <!-- Modal de nova função (fora do formulário principal, pois formulários não podem ficar um dentro do outro) -->
    <div class="modal fade" id="modalNovaFuncao" tabindex="-1"
         aria-labelledby="tituloNovaFuncao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">

                <form id="formNovaFuncao">

                    <div class="modal-header">
                        <h5 class="modal-title" id="tituloNovaFuncao">Nova função</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body">
                        <div id="erroNovaFuncao" class="alert alert-danger py-2 small d-none" role="alert"></div>

                        <label for="nomeNovaFuncao" class="form-label">Nome</label>
                        <input type="text"
                               id="nomeNovaFuncao"
                               class="form-control"
                               maxlength="60"
                               placeholder="Ex.: Teclado"
                               required>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-dark">
                            Salvar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    // ---------- Linhas de integrantes ----------

    const lista = document.getElementById('listaIntegrantes');
    const modelo = document.getElementById('modeloIntegrante');
    const avisoVazio = document.getElementById('semIntegrantes');

    function atualizarAvisoVazio() {
        avisoVazio.classList.toggle('d-none', lista.children.length > 0);
    }

    document.getElementById('botaoAdicionar').addEventListener('click', () => {
        lista.appendChild(modelo.content.cloneNode(true));
        atualizarAvisoVazio();
    });

    lista.addEventListener('click', evento => {
        const botao = evento.target.closest('.botao-remover');
        if (botao) {
            botao.closest('.linha-integrante').remove();
            atualizarAvisoVazio();
        }
    });

    atualizarAvisoVazio();

    // ---------- Nova função sem sair da tela ----------

    const urlFuncaoRapida = /*[[@{/funcoes-musicais/rapida}]]*/ '';
    const elementoModal = document.getElementById('modalNovaFuncao');
    const modalFuncao = new bootstrap.Modal(elementoModal);
    const campoNome = document.getElementById('nomeNovaFuncao');
    const erroFuncao = document.getElementById('erroNovaFuncao');

    function mostrarErroFuncao(mensagem) {
        erroFuncao.textContent = mensagem;
        erroFuncao.classList.remove('d-none');
    }

    function adicionarOpcaoDeFuncao(funcao) {
        document.querySelectorAll('select[name="funcaoIds"]')
            .forEach(campo => campo.add(new Option(funcao.nome, funcao.id)));

        modelo.content.querySelector('select[name="funcaoIds"]')
            .add(new Option(funcao.nome, funcao.id));
    }

    // Limpa a janela sempre que ela é aberta
    elementoModal.addEventListener('show.bs.modal', () => {
        campoNome.value = '';
        erroFuncao.classList.add('d-none');
    });

    // Coloca o cursor no campo assim que a janela termina de abrir
    elementoModal.addEventListener('shown.bs.modal', () => campoNome.focus());

    document.getElementById('formNovaFuncao').addEventListener('submit', async evento => {
        evento.preventDefault();
        erroFuncao.classList.add('d-none');

        const corpo = new URLSearchParams({
            nome: campoNome.value,
            _csrf: document.querySelector('input[name="_csrf"]').value
        });

        try {
            const resposta = await fetch(urlFuncaoRapida, { method: 'POST', body: corpo });
            const dados = await resposta.json();

            if (!resposta.ok) {
                mostrarErroFuncao(dados.erro);
                return;
            }

            adicionarOpcaoDeFuncao(dados);
            modalFuncao.hide();
        } catch (erro) {
            mostrarErroFuncao('Não foi possível salvar a função. Tente novamente.');
        }
    });
</script>

</body>
</html>
