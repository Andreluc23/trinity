<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Categoria financeira - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5" style="max-width: 640px;">

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-3 p-md-4">

            <h2 class="mb-4"
                th:text="${categoria.id == null ? 'Nova categoria' : 'Editar categoria'}">
                Nova categoria
            </h2>

            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{/financeiro/categorias}"
                  th:object="${categoria}"
                  method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ativo}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text"
                           id="nome"
                           class="form-control"
                           th:field="*{nome}"
                           maxlength="60"
                           placeholder="Ex.: Dízimo, Energia elétrica, Manutenção"
                           required>
                </div>

                <div class="mb-4">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required>
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo}"
                                th:text="${tipo.descricao}">
                        </option>
                    </select>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar
                    </button>

                    <a th:href="@{/financeiro}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
