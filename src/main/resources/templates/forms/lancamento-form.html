<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lançamento - Trinity</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5" style="max-width: 720px;">

  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-3 p-md-4">

      <h2 class="mb-4"
          th:text="${lancamento.id == null ? 'Novo lançamento' : 'Editar lançamento'}">
        Novo lançamento
      </h2>

      <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

      <form th:action="@{/financeiro/lancamentos}" method="post">

        <input type="hidden" name="id" th:value="${lancamento.id}">

        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <input type="text"
                 id="descricao"
                 name="descricao"
                 class="form-control"
                 th:value="${lancamento.descricao}"
                 maxlength="120"
                 placeholder="Ex.: Conta de luz de outubro"
                 required>
        </div>

        <div class="row g-3 mb-3">

          <div class="col-12 col-sm-6">
            <label for="valor" class="form-label">Valor (R$)</label>
            <input type="number"
                   id="valor"
                   name="valor"
                   class="form-control"
                   th:value="${lancamento.valor}"
                   min="0.01"
                   step="0.01"
                   placeholder="0,00"
                   required>
          </div>

          <div class="col-12 col-sm-6">
            <label for="data" class="form-label">Data</label>
            <input type="date"
                   id="data"
                   name="data"
                   class="form-control"
                   th:value="${lancamento.data}"
                   th:max="${hoje}"
                   required>
          </div>

        </div>

        <div class="mb-3">
          <label for="categoria" class="form-label">Categoria</label>
          <select id="categoria" name="categoria.id" class="form-select" required>

            <option value="">Selecione</option>

            <optgroup label="Entradas">
              <option th:each="categoria : ${categoriasEntrada}"
                      th:value="${categoria.id}"
                      th:text="${categoria.nome}"
                      th:selected="${lancamento.categoria != null and lancamento.categoria.id == categoria.id}">
              </option>
            </optgroup>

            <optgroup label="Saídas">
              <option th:each="categoria : ${categoriasSaida}"
                      th:value="${categoria.id}"
                      th:text="${categoria.nome}"
                      th:selected="${lancamento.categoria != null and lancamento.categoria.id == categoria.id}">
              </option>
            </optgroup>

          </select>
        </div>

        <div class="mb-4">
          <label for="membro" class="form-label">
            Membro <span class="text-muted">(opcional)</span>
          </label>
          <select id="membro" name="membro.id" class="form-select">

            <option value="">Nenhum</option>

            <option th:each="membro : ${membros}"
                    th:value="${membro.id}"
                    th:text="${membro.nomeCompleto}"
                    th:selected="${lancamento.membro != null and lancamento.membro.id == membro.id}">
            </option>

          </select>
          <div class="form-text">Use para dízimos e ofertas de um membro específico.</div>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2">
          <button type="submit" class="btn btn-dark">
            <i class="bi bi-check-lg me-1"></i>
            Salvar
          </button>

          <a th:href="@{/financeiro}" class="btn btn-outline-secondary">
            Cancelar
          </a>
        </div>

      </form>

    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
