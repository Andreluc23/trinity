<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Permissões - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('membros')}"></div>

<main class="container py-4 py-md-5">

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="mb-4">
                <h2 class="mb-1">Permissões do membro</h2>
                <p class="text-muted mb-0">
                    Defina quais funcionalidades este membro poderá administrar.
                </p>
            </div>

            <div class="card shadow-sm border-0">

                <div class="card-body p-3 p-md-4">

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="bg-light rounded-circle p-3">
                            <i class="bi bi-person-circle fs-3"></i>
                        </div>

                        <div>
                            <h5 class="mb-1"
                                th:text="${membro.nomeCompleto}">
                                Nome do membro
                            </h5>

                            <span class="text-muted"
                                  th:text="${membro.email}">
                                email@exemplo.com
                            </span>
                        </div>
                    </div>

                    <hr>

                    <form th:action="@{/usuarios/permissoes/{id}(id=${membro.id})}"
                          method="post"
                          th:object="${usuario}">

                        <h5 class="mb-3">Permissões administrativas</h5>

                        <div class="row g-3">

                            <div class="col-12 col-md-6">

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarMembros}">
                                    <label class="form-check-label">
                                        Gerenciar membros
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarAvisos}">
                                    <label class="form-check-label">
                                        Gerenciar avisos
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarEventos}">
                                    <label class="form-check-label">
                                        Gerenciar eventos
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarFinanceiro}">
                                    <label class="form-check-label">
                                        Gerenciar financeiro
                                    </label>
                                </div>

                            </div>

                            <div class="col-12 col-md-6">

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{acessoEscalas}">
                                    <label class="form-check-label">
                                        Visualizar escalas
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarEscalas}">
                                    <label class="form-check-label">
                                        Gerenciar escalas
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{gerenciarPatrimonio}">
                                    <label class="form-check-label">
                                        Gerenciar patrimônio
                                    </label>
                                </div>

                            </div>

                        </div>

                        <div class="alert alert-light border mt-4 mb-0">
                            <i class="bi bi-info-circle me-1"></i>
                            Todos os membros com conta ativa já possuem acesso
                            básico a avisos, eventos, Bíblia e pagamentos.
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                Salvar permissões
                            </button>

                            <a th:href="@{/membros}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
