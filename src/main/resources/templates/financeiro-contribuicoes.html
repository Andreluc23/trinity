<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contribuições - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h2 class="mb-1">Contribuições pendentes</h2>
            <p class="text-muted mb-0">
                Confira no extrato do banco pelo identificador <code>TRINITY...</code> antes de confirmar.
            </p>
        </div>

        <a th:href="@{/financeiro}" class="btn btn-outline-secondary text-nowrap">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar ao financeiro
        </a>

    </div>

    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Membro</th>
                        <th>Tipo</th>
                        <th class="text-end">Valor</th>
                        <th>Identificador</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="contribuicao : ${contribuicoes}">

                        <td class="text-nowrap"
                            th:text="${#temporals.format(contribuicao.criadaEm, 'dd/MM/yyyy HH:mm')}">10/10/2026 19:30</td>

                        <td th:text="${contribuicao.membro.nomeCompleto}">João</td>

                        <td th:text="${contribuicao.categoria.nome}">Dízimo</td>

                        <td class="text-end text-nowrap fw-semibold"
                            th:text="${#numbers.formatCurrency(contribuicao.valor)}">R$ 100,00</td>

                        <td><code th:text="${contribuicao.identificador}">TRINITY...</code></td>

                        <td th:switch="${contribuicao.status.name()}">
                            <span th:case="'AGUARDANDO_CONFIRMACAO'" class="badge text-bg-info">Membro informou pagamento</span>
                            <span th:case="*" class="badge text-bg-warning">PIX gerado</span>
                        </td>

                        <td class="text-end text-nowrap">

                            <form th:action="@{/financeiro/contribuicoes/{id}/confirmar(id=${contribuicao.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-success"
                                        onclick="return confirm('Confirmar que este valor caiu na conta da igreja? Um lançamento de entrada será criado.')">
                                    <i class="bi bi-check-lg me-1"></i>Confirmar
                                </button>
                            </form>

                            <form th:action="@{/financeiro/contribuicoes/{id}/rejeitar(id=${contribuicao.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Rejeitar esta contribuição? Nenhum lançamento será criado.')">
                                    Rejeitar
                                </button>
                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(contribuicoes)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-check2-all fs-3 d-block mb-2"></i>
                            Nenhuma contribuição pendente.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
