<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Leituras - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('avisos')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;">

    <div class="mb-4">
        <h2 class="mb-1" th:text="${aviso.titulo}">Título do aviso</h2>
        <p class="text-muted mb-0">
            Publicado em
            <span th:text="${#temporals.format(aviso.dataPublicacao, 'dd/MM/yyyy')}">01/11/2026</span>
        </p>
    </div>

    <div class="row g-4">

        <!-- Leram -->
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">

                    <h5 class="text-success mb-3">
                        <i class="bi bi-check-circle me-1"></i>
                        Leram (<span th:text="${#lists.size(leituras)}">0</span>)
                    </h5>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-0 d-flex justify-content-between"
                            th:each="leitura : ${leituras}">
                            <span th:text="${leitura.membro.nomeCompleto}">João</span>
                            <small class="text-muted"
                                   th:text="${#temporals.format(leitura.lidoEm, 'dd/MM HH:mm')}">01/11 19:30</small>
                        </li>
                    </ul>

                    <p th:if="${#lists.isEmpty(leituras)}" class="text-muted mb-0">Ninguém confirmou ainda.</p>

                </div>
            </div>
        </div>

        <!-- Ainda não leram -->
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">

                    <h5 class="text-secondary mb-3">
                        <i class="bi bi-hourglass-split me-1"></i>
                        Ainda não leram (<span th:text="${#lists.size(naoLeram)}">0</span>)
                    </h5>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-0" th:each="membro : ${naoLeram}"
                            th:text="${membro.nomeCompleto}">Maria</li>
                    </ul>

                    <p th:if="${#lists.isEmpty(naoLeram)}" class="text-muted mb-0">Todos já leram.</p>

                </div>
            </div>
        </div>

    </div>

    <p class="text-muted small mt-3">
        A lista "Ainda não leram" considera apenas membros ativos com acesso ao sistema.
    </p>

    <div class="mt-2">
        <a th:href="@{/avisos}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar para avisos
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
