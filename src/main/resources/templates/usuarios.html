<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Usuários - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('usuarios')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-md-row
                justify-content-between align-items-md-center
                gap-3 mb-4">

        <div>
            <h2 class="mb-1">Usuários</h2>

            <p class="text-muted mb-0">
                Gerencie os usuários e suas permissões de acesso.
            </p>
        </div>

        <a th:href="@{/usuarios/novo}"
           class="btn btn-primary text-nowrap">

            <i class="bi bi-person-plus me-1"></i>
            Novo usuário

        </a>

    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">

        <div class="table-responsive">

            <table class="table align-middle mb-0">

                <thead class="table-light">

                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.nome}">
                        João
                    </td>

                    <td th:text="${usuario.email}">
                        joao@email.com
                    </td>

                    <td>

                        <span th:if="${usuario.admin}"
                              class="badge text-bg-primary">
                            Administrador
                        </span>

                        <span th:unless="${usuario.admin}"
                              class="badge text-bg-secondary">
                            Usuário
                        </span>

                    </td>

                    <td>

                        <span th:if="${usuario.ativo}"
                              class="badge text-bg-success">
                            Ativo
                        </span>

                        <span th:unless="${usuario.ativo}"
                              class="badge text-bg-secondary">
                            Inativo
                        </span>

                    </td>

                    <td class="text-end text-nowrap">

                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                           class="btn btn-sm btn-outline-primary">

                            <i class="bi bi-pencil"></i>
                            Editar

                        </a>

                        <form th:if="${usuario.ativo}"
                              th:action="@{/usuarios/desativar/{id}(id=${usuario.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">

                                Desativar

                            </button>

                        </form>

                        <form th:unless="${usuario.ativo}"
                              th:action="@{/usuarios/ativar/{id}(id=${usuario.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-success">

                                Ativar

                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">

                    <td colspan="5"
                        class="text-center text-muted py-5">

                        <i class="bi bi-people fs-3 d-block mb-2"></i>

                        Nenhum usuário cadastrado.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
