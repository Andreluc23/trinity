<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escalas - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-sm-row
                justify-content-between align-items-sm-center
                gap-3 mb-4">

        <div>
            <h2 class="mb-1">Escalas</h2>
            <p class="text-muted mb-0">
                Gerencie as escalas de músicos da igreja.
            </p>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2">

            <a th:href="@{/funcoes-musicais}"
               class="btn btn-light text-nowrap">

                <i class="bi bi-music-note-list me-1"></i>
                Funções musicais
            </a>

            <a th:href="@{/escalas/nova}"
               class="btn btn-primary text-nowrap">

                <i class="bi bi-plus-circle me-1"></i>
                Nova escala
            </a>

        </div>

    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table align-middle mb-0 text-nowrap">

                    <thead class="table-light">
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="escala : ${escalas}">

                        <td th:text="${escala.titulo}">
                            Culto de Domingo
                        </td>

                        <td th:text="${#temporals.format(escala.data, 'dd/MM/yyyy')}">
                            20/09/2026
                        </td>

                        <td th:text="${#temporals.format(escala.horario, 'HH:mm')}">
                            19:00
                        </td>

                        <td>
                            <span th:if="${escala.ativo}"
                                  class="badge text-bg-success">
                                Ativa
                            </span>

                            <span th:unless="${escala.ativo}"
                                  class="badge text-bg-secondary">
                                Inativa
                            </span>
                        </td>

                        <td class="text-end">
                            <a th:href="@{/escalas/{id}(id=${escala.id})}"
                               class="btn btn-sm btn-outline-secondary">

                                <i class="bi bi-eye"></i>
                                Ver escala

                            </a>
                            <a th:href="@{/escalas/editar/{id}(id=${escala.id})}"
                               class="btn btn-sm btn-outline-primary">

                                <i class="bi bi-pencil"></i>
                                Editar
                            </a>

                            <form th:if="${escala.ativo}"
                                  th:action="@{/escalas/desativar/{id}(id=${escala.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Desativar
                                </button>

                            </form>

                            <form th:unless="${escala.ativo}"
                                  th:action="@{/escalas/ativar/{id}(id=${escala.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-success">
                                    Ativar
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(escalas)}">
                        <td colspan="5"
                            class="text-center text-muted py-4">
                            Nenhuma escala cadastrada.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
