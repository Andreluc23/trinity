<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escalas - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5"
      th:with="podeGerenciar=${#authorization.expression('hasAnyAuthority(''ROLE_ADMIN'', ''GERENCIAR_ESCALAS'')')}">

    <div class="d-flex flex-column flex-sm-row
                justify-content-between align-items-sm-center
                gap-3 mb-4">

        <div>
            <h2 class="mb-1">Escalas</h2>
            <p class="text-muted mb-0">
                Escalas de músicos da igreja.
            </p>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2"
             th:if="${podeGerenciar}">

            <button type="button"
                    class="btn btn-outline-dark text-nowrap"
                    data-bs-toggle="modal"
                    data-bs-target="#modalFuncoes">
                <i class="bi bi-music-note-list me-1"></i>
                Funções
            </button>

            <a th:href="@{/escalas/nova}"
               class="btn btn-dark text-nowrap">
                <i class="bi bi-plus-circle me-1"></i>
                Nova escala
            </a>

        </div>

    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table align-middle mb-0 text-nowrap">

                    <thead class="table-light">
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="escala : ${escalas}">

                        <td th:text="${escala.titulo}">Culto de Domingo</td>

                        <td th:text="${#temporals.format(escala.data, 'dd/MM/yyyy')}">20/09/2026</td>

                        <td th:text="${#temporals.format(escala.horario, 'HH:mm')}">19:00</td>

                        <td>
                            <span th:if="${escala.ativo}" class="badge text-bg-success">Ativa</span>
                            <span th:unless="${escala.ativo}" class="badge text-bg-secondary">Inativa</span>
                        </td>

                        <td class="text-end">
                            <a th:href="@{/escalas/{id}(id=${escala.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-eye"></i>
                                Ver escala
                            </a>

                            <a th:if="${podeGerenciar}"
                               th:href="@{/escalas/editar/{id}(id=${escala.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                                Editar
                            </a>

                            <form th:if="${podeGerenciar and escala.ativo}"
                                  th:action="@{/escalas/desativar/{id}(id=${escala.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Desativar
                                </button>
                            </form>

                            <form th:if="${podeGerenciar and !escala.ativo}"
                                  th:action="@{/escalas/ativar/{id}(id=${escala.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    Ativar
                                </button>
                            </form>
                            <form th:action="@{/funcoes-musicais/excluir/{id}(id=${funcao.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        title="Excluir"
                                        data-confirmar="Excluir esta função? Só é possível se ela nunca foi usada em escalas.">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>

                            <form th:if="${podeGerenciar}"
                                  th:action="@{/escalas/excluir/{id}(id=${escala.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        title="Excluir"
                                        data-confirmar="Excluir esta escala? Os integrantes escalados também serão removidos.">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(escalas)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Nenhuma escala cadastrada.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Modal de funções musicais -->
    <div th:if="${podeGerenciar}"
         class="modal fade" id="modalFuncoes" tabindex="-1"
         aria-labelledby="tituloFuncoes" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloFuncoes">Funções musicais</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <div th:if="${erroFuncao}" class="alert alert-danger" role="alert" th:text="${erroFuncao}"></div>

                    <!-- Cadastro rápido -->
                    <form th:action="@{/funcoes-musicais}"
                          th:object="${novaFuncao}"
                          method="post"
                          class="d-flex gap-2 mb-4">

                        <input type="text"
                               class="form-control"
                               th:field="*{nome}"
                               maxlength="60"
                               placeholder="Ex.: Violão, Vocal, Bateria"
                               aria-label="Nova função"
                               required>

                        <button type="submit" class="btn btn-dark text-nowrap">
                            <i class="bi bi-plus-lg me-1"></i>
                            Adicionar
                        </button>

                    </form>

                    <!-- Lista -->
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">

                            <tbody>

                            <tr th:each="funcao : ${funcoes}">

                                <td th:text="${funcao.nome}">Violão</td>

                                <td>
                                    <span th:if="${funcao.ativo}" class="badge text-bg-success">Ativa</span>
                                    <span th:unless="${funcao.ativo}" class="badge text-bg-secondary">Inativa</span>
                                </td>

                                <td class="text-end text-nowrap">

                                    <a th:href="@{/funcoes-musicais/editar/{id}(id=${funcao.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:if="${funcao.ativo}"
                                          th:action="@{/funcoes-musicais/desativar/{id}(id=${funcao.id})}"
                                          method="post"
                                          class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            Desativar
                                        </button>
                                    </form>

                                    <form th:unless="${funcao.ativo}"
                                          th:action="@{/funcoes-musicais/ativar/{id}(id=${funcao.id})}"
                                          method="post"
                                          class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success">
                                            Ativar
                                        </button>
                                    </form>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(funcoes)}">
                                <td colspan="3" class="text-center text-muted py-4">
                                    Nenhuma função cadastrada.
                                </td>
                            </tr>

                            </tbody>

                        </table>
                    </div>

                </div>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/confirmacao :: modal}"></th:block>

<!-- Reabre o modal depois de salvar, ativar ou desativar uma função -->
<script th:if="${abrirFuncoes}">
    new bootstrap.Modal(document.getElementById('modalFuncoes')).show();
</script>

</body>
</html>
