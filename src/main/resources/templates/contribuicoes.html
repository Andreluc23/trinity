<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contribuir - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5" style="max-width: 820px;">

    <div class="mb-4">
        <h2 class="mb-1">Contribuir</h2>
        <p class="text-muted mb-0">Faça sua contribuição para a igreja via PIX.</p>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

    <!-- Nova contribuição -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3 p-md-4">

            <form th:action="@{/contribuicoes}" method="post" class="row g-3 align-items-end">

                <div class="col-12 col-md-5">
                    <label for="categoriaId" class="form-label">Tipo</label>
                    <select id="categoriaId" name="categoriaId" class="form-select" required>
                        <option value="">Selecione</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nome}">
                        </option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label for="valor" class="form-label">Valor (R$)</label>
                    <input type="number"
                           id="valor"
                           name="valor"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           placeholder="0,00"
                           required>
                </div>

                <div class="col-12 col-md-3">
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-qr-code me-1"></i>
                        Gerar PIX
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Histórico -->
    <h5 class="mb-3">Minhas contribuições</h5>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th class="text-end">Valor</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="contribuicao : ${contribuicoes}">

                        <td class="text-nowrap"
                            th:text="${#temporals.format(contribuicao.criadaEm, 'dd/MM/yyyy')}">10/10/2026</td>

                        <td th:text="${contribuicao.categoria.nome}">Dízimo</td>

                        <td class="text-end text-nowrap"
                            th:text="${#numbers.formatCurrency(contribuicao.valor)}">R$ 100,00</td>

                        <td th:switch="${contribuicao.status.name()}">
                            <span th:case="'AGUARDANDO_PAGAMENTO'" class="badge text-bg-warning">Aguardando pagamento</span>
                            <span th:case="'AGUARDANDO_CONFIRMACAO'" class="badge text-bg-info">Aguardando confirmação</span>
                            <span th:case="'CONFIRMADA'" class="badge text-bg-success">Confirmada</span>
                            <span th:case="'REJEITADA'" class="badge text-bg-danger">Não identificada</span>
                        </td>

                        <td class="text-end">
                            <a th:if="${contribuicao.status.name() == 'AGUARDANDO_PAGAMENTO'}"
                               th:href="@{/contribuicoes/{id}(id=${contribuicao.id})}"
                               class="btn btn-sm btn-outline-dark text-nowrap">
                                Ver PIX
                            </a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(contribuicoes)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Você ainda não fez nenhuma contribuição pelo sistema.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
