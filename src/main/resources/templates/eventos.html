<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('eventos')}"></div>

<div class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h1 class="mb-1">Eventos</h1>

            <p class="text-muted mb-0">
                Gerencie os eventos cadastrados no sistema.
            </p>
        </div>

        <a th:href="@{/eventos/novo}"
           class="btn btn-primary text-nowrap">

            <i class="bi bi-calendar-plus me-2"></i>
            Novo evento

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle text-nowrap">

                    <thead>
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Local</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="evento : ${eventos}">

                        <td th:text="${evento.titulo}"></td>

                        <td th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')}"></td>

                        <td th:text="${#temporals.format(evento.horario, 'HH:mm')}"></td>

                        <td th:text="${evento.local}"></td>

                        <td>
                            <span th:if="${evento.ativo}"
                                  class="badge text-bg-success">
                                Ativo
                            </span>

                            <span th:unless="${evento.ativo}"
                                  class="badge text-bg-secondary">
                                Cancelado
                            </span>
                        </td>

                        <td>
                            <div class="d-flex gap-2">

                                <a th:href="@{/eventos/editar/{id}(id=${evento.id})}"
                                   class="btn btn-sm btn-outline-primary">

                                    <i class="bi bi-pencil me-1"></i>
                                    Editar

                                </a>

                                <form th:if="${evento.ativo}"
                                      th:action="@{/eventos/cancelar/{id}(id=${evento.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Deseja realmente cancelar este evento?')">

                                        <i class="bi bi-x-circle me-1"></i>
                                        Cancelar

                                    </button>

                                </form>

                                <form th:unless="${evento.ativo}"
                                      th:action="@{/eventos/ativar/{id}(id=${evento.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-success">

                                        <i class="bi bi-check-circle me-1"></i>
                                        Ativar

                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">

                            Nenhum evento cadastrado.

                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
