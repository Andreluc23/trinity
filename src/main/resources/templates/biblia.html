<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bíblia - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('biblia')}"></div>

<main class="container py-4 py-md-5">

    <div class="mb-4">
        <h2 class="mb-1">Bíblia Sagrada</h2>
        <p class="text-muted mb-0">Escolha um livro para começar a leitura.</p>
    </div>
    <form th:fragment="busca(termo)"
          th:action="@{/biblia/busca}"
          method="get"
          class="mb-4">
        <div class="input-group">
            <input type="search"
                   name="termo"
                   class="form-control"
                   th:value="${termo}"
                   minlength="3"
                   placeholder="Buscar palavra ou trecho (ex.: unigênito)"
                   aria-label="Buscar na Bíblia"
                   required>
            <button type="submit" class="btn btn-dark">
                <i class="bi bi-search me-1"></i>Buscar
            </button>
        </div>
    </form>

    <div class="row g-4">

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="mb-3">Antigo Testamento</h5>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:each="livro : ${antigoTestamento}"
                           th:href="@{/biblia/{n}(n=${livro.numero})}"
                           th:text="${livro.nome}"
                           class="btn btn-sm btn-outline-dark">Gênesis</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="mb-3">Novo Testamento</h5>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:each="livro : ${novoTestamento}"
                           th:href="@{/biblia/{n}(n=${livro.numero})}"
                           th:text="${livro.nome}"
                           class="btn btn-sm btn-outline-dark">Mateus</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <p th:fragment="credito" class="text-muted small mt-4 mb-0">
        Texto bíblico: <strong>Bíblia Livre (BLIVRE)</strong>, Copyright © Diego Santos, Mario Sérgio e Marco Teles,
        <a href="https://sites.google.com/site/biblialivre/" target="_blank" rel="noopener">sites.google.com/site/biblialivre</a>.
        Licença <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" target="_blank" rel="noopener">Creative Commons Atribuição 4.0</a>.
    </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
