<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Categorias financeiras - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h2 class="mb-1">Categorias financeiras</h2>
            <p class="text-muted mb-0">
                Classificação das entradas e saídas da igreja.
            </p>
        </div>

        <a th:href="@{/financeiro/categorias/nova}"
           class="btn btn-dark text-nowrap">
            <i class="bi bi-plus-circle me-1"></i>
            Nova categoria
        </a>

    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="categoria : ${categorias}">

                        <td th:text="${categoria.nome}">Dízimo</td>

                        <td>
                            <span th:if="${categoria.tipo.name() == 'ENTRADA'}"
                                  class="badge text-bg-success">
                                <i class="bi bi-arrow-down-circle me-1"></i>Entrada
                            </span>
                            <span th:if="${categoria.tipo.name() == 'SAIDA'}"
                                  class="badge text-bg-danger">
                                <i class="bi bi-arrow-up-circle me-1"></i>Saída
                            </span>
                        </td>

                        <td>
                            <span th:if="${categoria.ativo}" class="badge text-bg-success">Ativa</span>
                            <span th:unless="${categoria.ativo}" class="badge text-bg-secondary">Inativa</span>
                        </td>

                        <td class="text-end text-nowrap">

                            <a th:href="@{/financeiro/categorias/editar/{id}(id=${categoria.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                                Editar
                            </a>

                            <form th:if="${categoria.ativo}"
                                  th:action="@{/financeiro/categorias/desativar/{id}(id=${categoria.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deseja desativar esta categoria? Ela não aparecerá em novos lançamentos.')">
                                    Desativar
                                </button>
                            </form>

                            <form th:unless="${categoria.ativo}"
                                  th:action="@{/financeiro/categorias/ativar/{id}(id=${categoria.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    Ativar
                                </button>
                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            Nenhuma categoria cadastrada.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
