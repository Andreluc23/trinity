<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membros | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Membros</h1>
            <p class="text-muted mb-0">
                Lista de membros cadastrados no sistema.
            </p>
        </div>

        <a th:href="@{/membros/novo}" class="btn btn-primary">
            <i class="bi bi-person-plus me-2"></i>
            Novo membro
        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="membro : ${membros}">
                        <td th:text="${membro.nomeCompleto}"></td>
                        <td th:text="${membro.cpf}"></td>
                        <td th:text="${membro.telefone}"></td>
                        <td th:text="${membro.email}"></td>

                        <td>
                            <span th:if="${membro.ativo}"
                                  class="badge text-bg-success">
                                Ativo
                            </span>

                            <span th:unless="${membro.ativo}"
                                  class="badge text-bg-secondary">
                                Inativo
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(membros)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Nenhum membro cadastrado.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
