<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membros | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('membros')}"></div>
<div class="container py-5">


    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h1 class="mb-1">Membros</h1>
            <p class="text-muted mb-0">
                Lista de membros cadastrados no sistema.
            </p>
        </div>

        <<a th:href="@{/membros/novo}"
            class="btn btn-primary text-nowrap">
        <i class="bi bi-person-plus me-1"></i>
        Novo membro
    </a>

    </div>
    <form th:action="@{/membros}" method="get" class="mb-4">

        <div class="input-group">

            <input type="text"
                   name="busca"
                   class="form-control"
                   placeholder="Buscar por nome, CPF ou telefone..."
                   th:value="${busca}">

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search me-1"></i>
                Buscar
            </button>

            <a th:if="${busca != null and !busca.isBlank()}"
               th:href="@{/membros}"
               class="btn btn-outline-secondary">
                Limpar
            </a>

        </div>

    </form>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle text-nowrap">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="membro : ${membros}">

                        <td th:text="${membro.nomeCompleto}"></td>

                        <td th:text="${membro.cpf}"></td>

                        <td th:text="${membro.telefone}"></td>

                        <td th:text="${membro.email}"></td>

                        <td>
                            <span th:if="${membro.ativo}"
                                  class="badge text-bg-success">
                                Ativo
                            </span>

                            <span th:unless="${membro.ativo}"
                                  class="badge text-bg-secondary">
                                Inativo
                            </span>
                        </td>

                        <td>
                            <div class="d-flex gap-2">

                                <!-- Editar -->
                                <a th:href="@{/membros/editar/{id}(id=${membro.id})}"
                                   class="btn btn-sm btn-outline-primary">

                                    <i class="bi bi-pencil me-1"></i>
                                    Editar

                                </a>

                                <!-- Desativar -->
                                <form th:if="${membro.ativo}"
                                      th:action="@{/membros/desativar/{id}(id=${membro.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Deseja realmente desativar este membro?')">

                                        <i class="bi bi-person-x me-1"></i>
                                        Desativar

                                    </button>

                                </form>
                                <form th:unless="${membro.ativo}"
                                      th:action="@{/membros/ativar/{id}(id=${membro.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-success"
                                            onclick="return confirm('Deseja realmente ativar este membro?')">

                                        <i class="bi bi-person-check me-1"></i>
                                        Ativar

                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(membros)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">

                            Nenhum membro cadastrado.

                        </td>
                    </tr>

                    </tbody>

                </table>
                <!-- Paginação -->
                <nav th:if="${totalPaginas > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">

                        <!-- Anterior -->
                        <li class="page-item"
                            th:classappend="${paginaAtual == 0} ? 'disabled'">

                            <a class="page-link"
                               th:href="@{/membros(pagina=${paginaAtual - 1}, busca=${busca})}">
                                Anterior
                            </a>
                        </li>

                        <!-- Números das páginas -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                            th:classappend="${i == paginaAtual} ? 'active'">

                            <a class="page-link"
                               th:href="@{/membros(pagina=${i}, busca=${busca})}"
                               th:text="${i + 1}">
                                1
                            </a>
                        </li>

                        <!-- Próxima -->
                        <li class="page-item"
                            th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">

                            <a class="page-link"
                               th:href="@{/membros(pagina=${paginaAtual + 1}, busca=${busca})}">
                                Próxima
                            </a>
                        </li>

                    </ul>
                </nav>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
