<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso negado | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto text-center" style="max-width: 480px;">
        <div class="card-body p-5">

            <i class="bi bi-shield-lock text-danger display-4"></i>

            <h1 class="h4 mt-3">Acesso negado</h1>

            <p class="text-muted mb-4">
                Você não tem permissão para acessar esta página.
                Se precisar desse acesso, fale com o administrador.
            </p>

            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>
                Voltar ao início
            </a>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
