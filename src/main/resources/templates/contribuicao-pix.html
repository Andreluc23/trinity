<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pagamento PIX - Trinity</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('financeiro')}"></div>

<main class="container py-4 py-md-5" style="max-width: 520px;">

  <div class="card shadow-sm border-0">
    <div class="card-body p-4 text-center">

      <h2 class="h4 mb-1">Pagamento via PIX</h2>
      <p class="text-muted mb-4">
        <span th:text="${contribuicao.categoria.nome}">Dízimo</span> ·
        <strong th:text="${#numbers.formatCurrency(contribuicao.valor)}">R$ 100,00</strong>
      </p>

      <!-- QR Code -->
      <div id="qrcode" class="d-flex justify-content-center mb-3"></div>

      <p class="small text-muted mb-2">Ou use o PIX copia e cola:</p>

      <div class="input-group mb-3">
        <input type="text"
               id="copiaECola"
               class="form-control form-control-sm"
               th:value="${copiaECola}"
               readonly>
        <button type="button" id="botaoCopiar" class="btn btn-outline-dark btn-sm">
          <i class="bi bi-clipboard me-1"></i>Copiar
        </button>
      </div>

      <div class="alert alert-light border small text-start">
        <i class="bi bi-shield-check me-1"></i>
        Antes de confirmar no app do banco, verifique se o recebedor é
        <strong th:text="${recebedor}">Igreja Trinity</strong>.
      </div>

      <p class="small text-muted mb-4">
        Identificador: <code th:text="${contribuicao.identificador}">TRINITY...</code>
      </p>

      <form th:if="${contribuicao.status.name() == 'AGUARDANDO_PAGAMENTO'}"
            th:action="@{/contribuicoes/{id}/paguei(id=${contribuicao.id})}"
            method="post"
            class="mb-2">
        <button type="submit" class="btn btn-success w-100">
          <i class="bi bi-check2-circle me-1"></i>
          Já paguei
        </button>
      </form>

      <a th:href="@{/contribuicoes}" class="btn btn-link text-decoration-none">
        Voltar
      </a>

    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script th:inline="javascript">
  const codigoPix = /*[[${copiaECola}]]*/ '';

  new QRCode(document.getElementById('qrcode'), {
    text: codigoPix,
    width: 220,
    height: 220
  });

  document.getElementById('botaoCopiar').addEventListener('click', async () => {
    await navigator.clipboard.writeText(codigoPix);
    const botao = document.getElementById('botaoCopiar');
    botao.innerHTML = '<i class="bi bi-check2 me-1"></i>Copiado';
    setTimeout(() => botao.innerHTML = '<i class="bi bi-clipboard me-1"></i>Copiar', 2000);
  });
</script>

</body>
</html>
