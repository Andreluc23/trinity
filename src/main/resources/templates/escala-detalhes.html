<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalhes da Escala - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;"
      th:with="podeGerenciar=${#authorization.expression('hasAnyAuthority(''ROLE_ADMIN'', ''GERENCIAR_ESCALAS'')')}">

    <!-- Dados da escala -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3 p-md-4">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3">

                <div>
                    <h2 class="mb-2" th:text="${escala.titulo}">Culto de Domingo</h2>

                    <div class="text-muted mb-2">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${#temporals.format(escala.data, 'dd/MM/yyyy')}">20/09/2026</span>
                        <span class="mx-1">às</span>
                        <span th:text="${#temporals.format(escala.horario, 'HH:mm')}">19:00</span>
                        <span th:unless="${escala.ativo}" class="badge text-bg-secondary ms-2">Inativa</span>
                    </div>

                    <p th:if="${escala.observacao != null && !escala.observacao.isBlank()}"
                       th:text="${escala.observacao}"
                       class="mb-0">
                        Observação
                    </p>
                </div>

                <a th:if="${podeGerenciar}"
                   th:href="@{/escalas/editar/{id}(id=${escala.id})}"
                   class="btn btn-outline-primary text-nowrap">
                    <i class="bi bi-pencil me-1"></i>
                    Editar escala
                </a>

            </div>

        </div>
    </div>

    <!-- Integrantes (somente visualização: para alterar, use "Editar escala") -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">

            <h5 class="px-3 px-md-4 pt-3 pt-md-4 mb-3">Integrantes</h5>

            <div class="table-responsive">
                <table class="table align-middle mb-0">

                    <thead>
                    <tr>
                        <th>Função / Instrumento</th>
                        <th>Membro</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="item : ${itens}">
                        <td th:text="${item.funcaoMusical.nome}">Violão</td>
                        <td th:text="${item.membro.nomeCompleto}">João</td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(itens)}">
                        <td colspan="2" class="text-center text-muted py-4">
                            Nenhum integrante nesta escala.
                            <a th:if="${podeGerenciar}"
                               th:href="@{/escalas/editar/{id}(id=${escala.id})}">Adicionar integrantes</a>
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/escalas}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Voltar para escalas
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
