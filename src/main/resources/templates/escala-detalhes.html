<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalhes da Escala - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('escalas')}"></div>

<main class="container py-4 py-md-5">

    <!-- Dados da escala -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body p-3 p-md-4">

            <div class="d-flex flex-column flex-md-row
                        justify-content-between align-items-md-start
                        gap-3">

                <div>

                    <h2 class="mb-2"
                        th:text="${escala.titulo}">
                        Culto de Domingo
                    </h2>

                    <div class="text-muted mb-2">

                        <i class="bi bi-calendar3 me-1"></i>

                        <span th:text="${#temporals.format(escala.data, 'dd/MM/yyyy')}">
                            20/09/2026
                        </span>

                        <span class="mx-1">às</span>

                        <span th:text="${#temporals.format(escala.horario, 'HH:mm')}">
                            19:00
                        </span>

                    </div>

                    <p th:if="${escala.observacao != null && !escala.observacao.isBlank()}"
                       th:text="${escala.observacao}"
                       class="mb-0">
                        Observação
                    </p>

                </div>

                <a th:href="@{/escalas/editar/{id}(id=${escala.id})}"
                   class="btn btn-outline-primary text-nowrap">

                    <i class="bi bi-pencil me-1"></i>
                    Editar escala

                </a>

            </div>

        </div>

    </div>


    <!-- Integrantes -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-3 p-md-4">

            <div class="mb-4">

                <h5 class="mb-1">
                    Integrantes
                </h5>

                <p class="text-muted mb-0">
                    Adicione os membros e suas funções nesta escala.
                </p>

            </div>


            <!-- Adicionar integrante -->
            <form th:action="@{/escalas/{id}/integrantes(id=${escala.id})}"
                  method="post"
                  class="row g-3 align-items-end mb-4">

                <div class="col-12 col-md-5">

                    <label class="form-label">
                        Membro
                    </label>

                    <select class="form-select"
                            name="membroId"
                            required>

                        <option value="">
                            Selecione um membro
                        </option>

                        <option th:each="membro : ${membros}"
                                th:value="${membro.id}"
                                th:text="${membro.nomeCompleto}">
                        </option>

                    </select>

                </div>

                <div class="col-12 col-md-5">

                    <label class="form-label">
                        Função / Instrumento
                    </label>

                    <select class="form-select"
                            name="funcaoId"
                            required>

                        <option value="">
                            Selecione uma função
                        </option>

                        <option th:each="funcao : ${funcoes}"
                                th:value="${funcao.id}"
                                th:text="${funcao.nome}">
                        </option>

                    </select>

                </div>

                <div class="col-12 col-md-2">

                    <button type="submit"
                            class="btn btn-success w-100">

                        <i class="bi bi-plus-lg me-1"></i>
                        Adicionar

                    </button>

                </div>

            </form>


            <!-- Lista -->
            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th>Membro</th>
                        <th>Função / Instrumento</th>
                        <th class="text-end">Ação</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="item : ${itens}">

                        <td th:text="${item.membro.nomeCompleto}">
                            João
                        </td>

                        <td th:text="${item.funcaoMusical.nome}">
                            Violão
                        </td>

                        <td class="text-end">

                            <form th:action="@{/escalas/{escalaId}/integrantes/remover/{itemId}(
                                    escalaId=${escala.id},
                                    itemId=${item.id}
                                )}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Deseja realmente remover este integrante da escala?')">

                                    <i class="bi bi-trash me-1"></i>
                                    Remover

                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(itens)}">

                        <td colspan="3"
                            class="text-center text-muted py-4">

                            Nenhum integrante adicionado nesta escala.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-3">

        <a th:href="@{/escalas}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-1"></i>
            Voltar para escalas

        </a>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
