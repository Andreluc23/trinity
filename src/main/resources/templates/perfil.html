<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu perfil | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('perfil')}"></div>

<div class="container py-5" style="max-width: 720px;">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h1 class="mb-1">Meu perfil</h1>
            <p class="text-muted mb-0">Seus dados cadastrados na igreja.</p>
        </div>

        <button type="button"
                class="btn btn-dark text-nowrap"
                data-bs-toggle="collapse"
                data-bs-target="#formSenha"
                aria-controls="formSenha">
            <i class="bi bi-key me-1"></i> Alterar senha
        </button>

    </div>

    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

    <!-- Alterar senha (aberto automaticamente se houve erro) -->
    <div id="formSenha"
         class="collapse mb-4"
         th:classappend="${erro} ? ' show' : ''">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h2 class="h5 mb-3">Alterar senha</h2>

                <form th:action="@{/perfil/senha}" method="post">

                    <div class="mb-3">
                        <label for="senhaAtual" class="form-label">Senha atual</label>
                        <input type="password" id="senhaAtual" name="senhaAtual"
                               class="form-control" autocomplete="current-password" required>
                    </div>

                    <div class="mb-3">
                        <label for="novaSenha" class="form-label">Nova senha</label>
                        <input type="password" id="novaSenha" name="novaSenha"
                               class="form-control" autocomplete="new-password" minlength="8" required>
                        <div class="form-text">Mínimo de 8 caracteres.</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmacao" class="form-label">Confirmar nova senha</label>
                        <input type="password" id="confirmacao" name="confirmacao"
                               class="form-control" autocomplete="new-password" minlength="8" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">
                            Salvar nova senha
                        </button>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-toggle="collapse"
                                data-bs-target="#formSenha">
                            Cancelar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

    <!-- Dados do membro -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <dl class="row mb-0">

                <dt class="col-sm-4">Nome</dt>
                <dd class="col-sm-8" th:text="${membro.nomeCompleto}"></dd>

                <dt class="col-sm-4">CPF</dt>
                <dd class="col-sm-8" th:text="${membro.cpf}"></dd>

                <dt class="col-sm-4">Nascimento</dt>
                <dd class="col-sm-8"
                    th:text="${#temporals.format(membro.dataNascimento, 'dd/MM/yyyy')}"></dd>

                <dt class="col-sm-4">Telefone</dt>
                <dd class="col-sm-8" th:text="${membro.telefone}"></dd>

                <dt class="col-sm-4">E-mail</dt>
                <dd class="col-sm-8" th:text="${membro.email}"></dd>

                <dt class="col-sm-4">Endereço</dt>
                <dd class="col-sm-8 mb-0"
                    th:text="${membro.endereco != null and !membro.endereco.isBlank()} ? ${membro.endereco} : 'Não informado'"></dd>

            </dl>

        </div>
    </div>

    <p class="text-muted small mt-3">
        Para corrigir algum dado, fale com a administração da igreja.
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
