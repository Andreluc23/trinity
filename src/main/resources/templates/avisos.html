<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avisos | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('avisos')}"></div>

<div class="container py-5"
     th:with="podeGerenciar=${#authorization.expression('hasAnyAuthority(''ROLE_ADMIN'', ''GERENCIAR_AVISOS'')')}">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <div>
            <h1 class="mb-1">Avisos</h1>
            <p class="text-muted mb-0">
                Comunicados da igreja.
            </p>
        </div>

        <a th:href="@{/avisos/novo}"
           th:if="${podeGerenciar}"
           class="btn btn-dark text-nowrap">
            <i class="bi bi-plus-lg me-2"></i>
            Novo aviso
        </a>

    </div>

    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>
                    <tr>
                        <th>Aviso</th>
                        <th>Data</th>
                        <th th:if="${podeGerenciar}">Status</th>
                        <th>Leitura</th>
                        <th th:if="${podeGerenciar}">Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="aviso : ${avisos}">

                        <td style="min-width: 260px;">
                            <div class="fw-semibold" th:text="${aviso.titulo}">Título</div>
                            <div class="text-muted small" style="white-space: pre-line;"
                                 th:text="${aviso.mensagem}">Mensagem do aviso</div>
                        </td>

                        <td class="text-nowrap"
                            th:text="${#temporals.format(aviso.dataPublicacao, 'dd/MM/yyyy')}"></td>

                        <td th:if="${podeGerenciar}">
                            <span th:if="${aviso.ativo}" class="badge text-bg-success">Ativo</span>
                            <span th:unless="${aviso.ativo}" class="badge text-bg-secondary">Inativo</span>
                        </td>

                        <!-- Leitura -->
                        <td class="text-nowrap">
                            <div class="d-flex align-items-center gap-2">

                                <span th:if="${avisosLidos.contains(aviso.id)}" class="badge text-bg-success">
                                    <i class="bi bi-check2 me-1"></i>Lido
                                </span>

                                <form th:if="${aviso.ativo and !avisosLidos.contains(aviso.id)}"
                                      th:action="@{/avisos/{id}/leitura(id=${aviso.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-check2 me-1"></i>Marcar como lido
                                    </button>
                                </form>

                                <!-- Placar, só para quem gerencia -->
                                <a th:if="${podeGerenciar}"
                                   th:with="lidos=${leituras[aviso.id] != null ? leituras[aviso.id] : 0},
                                    pendentes=${leitoresPossiveis - lidos > 0 ? leitoresPossiveis - lidos : 0}"
                                   th:href="@{/avisos/{id}/leituras(id=${aviso.id})}"
                                   class="placar"
                                   th:title="${lidos + ' leram · ' + pendentes + ' ainda não leram'}">
                                    <span class="placar-sim"><i class="bi bi-check2 me-1"></i><span th:text="${lidos}">0</span></span>
                                    <span class="placar-pendente"><i class="bi bi-hourglass-split me-1"></i><span th:text="${pendentes}">0</span></span>
                                </a>

                            </div>
                        </td>

                        <td th:if="${podeGerenciar}">
                            <div class="d-flex gap-2">

                                <a th:href="@{/avisos/editar/{id}(id=${aviso.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil me-1"></i>
                                    Editar
                                </a>

                                <form th:if="${aviso.ativo}"
                                      th:action="@{/avisos/desativar/{id}(id=${aviso.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            data-confirmar="Deseja realmente desativar este aviso?">
                                        Desativar
                                    </button>
                                </form>

                                <form th:unless="${aviso.ativo}"
                                      th:action="@{/avisos/ativar/{id}(id=${aviso.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        Ativar
                                    </button>
                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(avisos)}">
                        <td th:colspan="${podeGerenciar} ? 5 : 3"
                            class="text-center text-muted py-4">
                            Nenhum aviso publicado.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/confirmacao :: modal}"></th:block>

</body>
</html>
