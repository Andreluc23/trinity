<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avisos | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <a th:href="@{/dashboard}" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left me-2"></i>
        Voltar ao dashboard
    </a>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Avisos</h1>
            <p class="text-muted mb-0">
                Gerencie os avisos publicados no sistema.
            </p>
        </div>

        <a th:href="@{/avisos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>
            Novo aviso
        </a>

    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="aviso : ${avisos}">

                        <td th:text="${aviso.titulo}"></td>

                        <td th:text="${#temporals.format(aviso.dataPublicacao, 'dd/MM/yyyy')}"></td>

                        <td>
                            <span th:if="${aviso.ativo}"
                                  class="badge text-bg-success">
                                Ativo
                            </span>

                            <span th:unless="${aviso.ativo}"
                                  class="badge text-bg-secondary">
                                Inativo
                            </span>
                        </td>

                        <td>
                            <div class="d-flex gap-2">

                                <a th:href="@{/avisos/editar/{id}(id=${aviso.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil me-1"></i>
                                    Editar
                                </a>

                                <form th:if="${aviso.ativo}"
                                      th:action="@{/avisos/desativar/{id}(id=${aviso.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Deseja realmente desativar este aviso?')">
                                        Desativar
                                    </button>

                                </form>

                                <form th:unless="${aviso.ativo}"
                                      th:action="@{/avisos/ativar/{id}(id=${aviso.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-success">
                                        Ativar
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(avisos)}">
                        <td colspan="4"
                            class="text-center text-muted py-4">
                            Nenhum aviso cadastrado.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
