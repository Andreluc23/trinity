<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${livro.nome + ' ' + capitulo + ' - Bíblia - Trinity'}">Bíblia - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('biblia')}"></div>

<main class="container py-4 py-md-5" style="max-width: 800px;">
    <a th:href="@{/biblia}" class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Todos os livros
    </a>

    <h2 class="mt-2 mb-4" th:text="${livro.nome}">João</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h6 class="text-muted mb-3">Capítulos</h6>
    <a th:href="@{/biblia/{l}(l=${livro.numero})}" class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>
        <span th:text="${'Capítulos de ' + livro.nome}">Capítulos de João</span>
    </a>

    <h2 class="mt-2 mb-4" th:text="${livro.nome + ' ' + capitulo}">João 3</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4 texto-biblico">

            <p th:each="texto, status : ${versiculos}"
               th:id="${'v' + status.count}"
               class="versiculo mb-2">
                <sup class="text-muted fw-semibold me-1" th:text="${status.count}">1</sup>
                <span th:text="${texto}">Texto do versículo</span>
            </p>

        </div>
    </div>

    <!-- Navegação entre capítulos -->
    <div class="d-flex justify-content-between mt-3">

        <a th:if="${anterior != null}"
           th:href="@{/biblia/{l}/{c}(l=${anterior.livro.numero}, c=${anterior.capitulo})}"
           class="btn btn-outline-dark">
            <i class="bi bi-chevron-left me-1"></i>
            <span th:text="${anterior.livro.nome + ' ' + anterior.capitulo}">João 2</span>
        </a>
        <span th:unless="${anterior != null}"></span>

        <a th:if="${proximo != null}"
           th:href="@{/biblia/{l}/{c}(l=${proximo.livro.numero}, c=${proximo.capitulo})}"
           class="btn btn-outline-dark">
            <span th:text="${proximo.livro.nome + ' ' + proximo.capitulo}">João 4</span>
            <i class="bi bi-chevron-right ms-1"></i>
        </a>

    </div>

    <th:block th:replace="~{biblia :: credito}"></th:block>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
