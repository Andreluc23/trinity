<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${livro.nome + ' - Bíblia - Trinity'}">Bíblia - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('biblia')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;">

    <a th:href="@{/biblia}" class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Todos os livros
    </a>

    <h2 class="mt-2 mb-4" th:text="${livro.nome}">João</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h6 class="text-muted mb-3">Capítulos</h6>
            <div class="d-flex flex-wrap gap-2">
                <a th:each="numero : ${#numbers.sequence(1, livro.quantidadeCapitulos())}"
                   th:href="@{/biblia/{l}/{c}(l=${livro.numero}, c=${numero})}"
                   th:text="${numero}"
                   class="btn btn-outline-dark"
                   style="min-width: 3rem;">1</a>
            </div>
        </div>
    </div>

    <th:block th:replace="~{biblia :: credito}"></th:block>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
