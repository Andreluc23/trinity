<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aviso | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <a th:href="@{/avisos}" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left me-2"></i>
        Voltar
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h2 class="mb-4"
                th:text="${aviso.id == null ? 'Novo aviso' : 'Editar aviso'}">
                Novo aviso
            </h2>

            <form th:action="@{/avisos}"
                  th:object="${aviso}"
                  method="post">

                <!-- Mantém os dados durante a edição -->
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{ativo}">

                <div class="mb-3">
                    <label class="form-label">Título</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{titulo}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mensagem</label>

                    <textarea class="form-control"
                              th:field="*{mensagem}"
                              rows="6"
                              required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Data de publicação</label>

                    <input type="date"
                           class="form-control"
                           name="dataPublicacao"
                           th:value="${aviso.dataPublicacao != null ? #temporals.format(aviso.dataPublicacao, 'yyyy-MM-dd') : ''}"
                           required>
                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar
                    </button>

                    <a th:href="@{/avisos}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
