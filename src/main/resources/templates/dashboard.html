<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex">

    <aside class="bg-dark text-white min-vh-100 p-3 d-flex flex-column" style="width: 250px;">

        <h4 class="mb-4">
            Trinity
        </h4>

        <nav class="nav flex-column gap-2">

            <a class="nav-link text-white bg-secondary rounded" href="#">
                <i class="bi bi-house-door me-2"></i>
                Início
            </a>

            <a class="nav-link text-white" th:href="@{/membros}">
                <i class="bi bi-people me-2"></i>
                Membros
            </a>

            <a class="nav-link text-white" href="#">
                <i class="bi bi-megaphone me-2"></i>
                Avisos
            </a>

            <a class="nav-link text-white" href="#">
                <i class="bi bi-calendar-event me-2"></i>
                Eventos
            </a>

            <a class="nav-link text-white" href="#">
                <i class="bi bi-cash-coin me-2"></i>
                Financeiro
            </a>

            <a class="nav-link text-white" href="#">
                <i class="bi bi-book me-2"></i>
                Bíblia
            </a>

        </nav>

        <div class="mt-auto">

            <hr>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="nav-link text-white border-0 bg-transparent">
                    <i class="bi bi-box-arrow-right me-2"></i>
                    Sair
                </button>
            </form>

        </div>

    </aside>

    <main class="flex-grow-1 p-5">

        <h1>Bem-vindo ao Trinity</h1>

        <p class="text-muted">
            Você está na área interna do sistema.
        </p>
        <div class="row g-4 mt-2">

            <!-- Total de membros -->
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Total de membros
                                </p>

                                <h3 class="mb-0">
                                    0
                                </h3>
                            </div>

                            <i class="bi bi-people fs-1 text-primary"></i>

                        </div>
                    </div>
                </div>
            </div>


            <!-- Membros ativos -->
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Membros ativos
                                </p>

                                <h3 class="mb-0">
                                    0
                                </h3>
                            </div>

                            <i class="bi bi-person-check fs-1 text-success"></i>

                        </div>
                    </div>
                </div>
            </div>


            <!-- Membros inativos -->
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Membros inativos
                                </p>

                                <h3 class="mb-0">
                                    0
                                </h3>
                            </div>

                            <i class="bi bi-person-x fs-1 text-danger"></i>

                        </div>
                    </div>
                </div>
            </div>


            <!-- Saldo financeiro -->
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Saldo financeiro
                                </p>

                                <h3 class="mb-0">
                                    R$ 0,00
                                </h3>
                            </div>

                            <i class="bi bi-wallet2 fs-1 text-warning"></i>

                        </div>
                    </div>
                </div>
            </div>

        </div>
        <!-- Gráficos -->
        <div class="row g-4 mt-4">

            <!-- Resumo financeiro -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body">

                        <h5 class="card-title mb-3">
                            Resumo financeiro
                        </h5>

                        <div class="d-flex justify-content-center align-items-center"
                             style="height: 300px;">

                            <p class="text-muted mb-0">
                                Gráfico financeiro
                            </p>

                        </div>

                    </div>

                </div>
            </div>


            <!-- Situação dos membros -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 h-100">

                    <div class="card-body">

                        <h5 class="card-title mb-3">
                            Situação dos membros
                        </h5>

                        <div class="d-flex justify-content-center align-items-center"
                             style="height: 300px;">

                            <p class="text-muted mb-0">
                                Gráfico de membros
                            </p>

                        </div>

                    </div>

                </div>
            </div>

        </div>

    </main>

</div>

</body>
</html>
