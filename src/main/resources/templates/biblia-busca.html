<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Busca na Bíblia - Trinity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('biblia')}"></div>

<main class="container py-4 py-md-5" style="max-width: 900px;">

    <a th:href="@{/biblia}" class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Todos os livros
    </a>

    <h2 class="mt-2 mb-4">Busca na Bíblia</h2>

    <form th:replace="~{biblia :: busca(${termo})}"></form>

    <div th:if="${erro}" class="alert alert-warning" role="alert" th:text="${erro}"></div>

    <th:block th:if="${resultado != null}">

        <p class="text-muted">
            <span th:text="${resultado.total}">0</span> versículo(s) encontrado(s)
            <span th:if="${resultado.limitado}"
                  th:text="${'· mostrando os ' + #lists.size(resultado.versiculos) + ' primeiros. Refine a busca para ver outros.'}"></span>
        </p>

        <div class="card shadow-sm border-0">
            <div class="list-group list-group-flush">

                <a th:each="v : ${resultado.versiculos}"
                   th:href="@{/biblia/{l}/{c}(l=${v.livro.numero}, c=${v.capitulo})} + '#v' + ${v.numero}"
                   class="list-group-item list-group-item-action py-3">
                    <div class="fw-semibold mb-1"
                         th:text="${v.livro.nome + ' ' + v.capitulo + ':' + v.numero}">João 3:16</div>
                    <div class="text-muted" th:text="${v.texto}">Texto do versículo</div>
                </a>

            </div>
        </div>

        <p th:if="${resultado.total == 0}" class="text-muted text-center py-4">
            Nenhum versículo encontrado com esse termo.
        </p>

    </th:block>

    <th:block th:replace="~{biblia :: credito}"></th:block>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
